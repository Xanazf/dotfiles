# baseline
general {
  border_size = 1
  gaps_in = 8
  gaps_out = 15
  col.active_border = rgba(89b4fa00) rgba(89b4fa00) rgba(ff225bdf) rgba(89b4fa00) rgba(89b4fa00) rgba(4e44ffd0) rgba(89b4fa00) rgba(89b4fa00) 75deg
  col.inactive_border = rgba(89b4fa00) rgba(89b4fa00) rgba(ff668d59) rgba(89b4fa00) rgba(89b4fa00) rgba(8e88ff9a) rgba(89b4fa00) rgba(89b4fa00) 75deg
  # col.inactive_border=0xff45475a 0xff45475a 0xff454700 -75deg

  # col.active_border = rgb(4a7bff) rgb(56bbf1) rgb(00dfa2) 45deg
  # col.inactive_border = rgb(4a7bff) rgb(56bbf1) rgb(00dfa2) -45deg

  layout = dwindle

  # -- fullscreen apps
  allow_tearing = true
  no_focus_fallback = true

  snap {
    enabled = false
    window_gap = 8
    monitor_gap = 15
    respect_gaps = true
  }
}

decoration {
  rounding = 15
  rounding_power = 3.3

  active_opacity = 1.0
  inactive_opacity = 0.75
  fullscreen_opacity = 1.0

  dim_modal = false
  dim_inactive = true
  dim_strength = 0.15
  dim_special = 0.3

  border_part_of_window = true

  blur {
    enabled = true
    size = 6
    passes = 3
    ignore_opacity = true
    new_optimizations = true
    xray = true
    noise = 0.0117
    contrast = 1.6816
    brightness = 0.8172
    vibrancy = 0.9126
    vibrancy_darkness = 0.1696
    input_methods = true
    input_methods_ignorealpha = 0.2
  }
  shadow {
    enabled = true
    range = 3
    render_power = 3
    ignore_window = false
    color = rgba(7233de42)
    color_inactive = rgba(5421bf21)
    # offset = 0.5 40
  }
}

animations {
  enabled = true
  workspace_wraparound = true

  # animation definitions
  bezier = expOutOvershot, -0.15, 1.15, -0.05, 1.05
  bezier = expOut, 0.05, 0.95, 0.035, 1.05
  bezier = overshot, 0.13, 0.99, 0.29, 1.1

  # window bobbing
  animation = windows, 1, 4, overshot, slide
  animation = workspaces, 1, 6, overshot, slide

  # border spin
  animation = border, 1, 0.6, default
  animation = borderangle, 1, 60, default
  animation = fade, 1, 10, default
}

input {
  # kb_model =
  kb_layout = us,ua,us
  kb_variant = ,,dvorak
  kb_options = grp:alt_shift_toggle
  kb_rules =
  resolve_binds_by_sym = false
  sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
  accel_profile = adaptive

  follow_mouse = 1
  mouse_refocus = false
  float_switch_override_focus = 2

  touchpad {
    natural_scroll = false
  }

  touchdevice {
    output = DP-1
  }

  virtualkeyboard {
    release_pressed_on_close = true
  }

  tablet {
    output = DP-1
  }
# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#executing for more
# device:epic-mouse-v1 {
#    sensitivity = -0.5
# }
}

gestures {
}

