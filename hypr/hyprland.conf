# monitors
# monitor = DP-1, 2560x1440@165, 0x0, 1, bitdepth, 10, cm, auto

$monitor0 = DP-1
$monitor1 = DP-2

monitorv2 {
  output = $monitor0
  mode = 2560x1440@165
  position = 0x0
  scale = 1
  supports_wide_color = 1
  supports_hdr = 1

  # bitdepth = 10
  # cm = hdredid
  vrr = 3

  sdrbrightness = 1.2
  sdrsaturation = 0.99
  sdr_min_luminance = 0.027
  sdr_max_luminance = 450
  max_avg_luminance = 300
}

monitor = $monitor1, 1920x1200@60, 2560x0, 1, transform, 1

# -- laptop
# monitor = eDP-1, 1920x1080@60, 0x0, 1

# execute at launch
exec-once = $HOME/.config/hypr/scripts/autostart

# plugins
# exec-once = hyprpm reload -n
# plugin = /usr/lib/libhy3.so
