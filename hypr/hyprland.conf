misc {
  disable_splash_rendering = true
  font_family = Hack Nerd Font
  force_default_wallpaper = -1
  layers_hog_keyboard_focus = true
  animate_manual_resizes = true
  animate_mouse_windowdragging = true
  enable_swallow = false
  focus_on_activate = true
  anr_missed_pings = 3
  vfr = false
}

binds {
  hide_special_on_workspace_change = true
  workspace_center_on = 1
}

xwayland {
  use_nearest_neighbor = false
  force_zero_scaling = true
  create_abstract_socket = false
}

render {
  direct_scanout = 2
  cm_fs_passthrough = 1
  cm_enabled = false
  cm_sdr_eotf = 2
  non_shader_cm = 3
  send_content_type = true
  new_render_scheduling = true
}

quirks {
  prefer_hdr = 1
}

cursor {
  no_hardware_cursors = 2 # tearing only
  no_break_fs_vrr = 2 # auto
  persistent_warps = true
  default_monitor = $monitor
  warp_on_change_workspace = true
  enable_hyprcursor = true
  # use_cpu_buffer = 2 # nvidia only
}

debug {
  disable_logs = false
  disable_time = false
  damage_blink = false
  enable_stdout_logs = true
  colored_stdout_logs = false
  # full_cm_proto = true
}

dwindle {
    # See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
    pseudotile = yes # master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = yes # you probably want this
}

master {
    # See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
    new_status = master
    orientation = left
}

# GLOB
# -- variable/tag setting
windowrule {
  name = windowrule-1
  tag = +decor
  match:class = ^(.*showmethekey)$
}


windowrule {
  name = windowrule-2
  tag = +util
  match:class = ^(showmethekey.*)$
}

windowrule {
  name = windowrule-3
  tag = +pop
  match:class = ^(.*pavucontrol)$
}

windowrule {
  name = windowrule-4
  tag = +pop
  match:class = ^([tT]hunar)$
}



windowrule {
  name = windowrule-5
  tag = +web
  match:class = ^(firefox*?)$
}

windowrule {
  name = windowrule-6
  tag = +important
  match:class = ^(zen-.*)$
}

windowrule {
  name = windowrule-7
  tag = +important
  match:class = ^(kitty)$
}

# -- rule setting
windowrule {
  name = windowrule-8
  size = (monitor_w*0.35) (monitor_h*0.35)
  float = on
  center = 1
  match:tag = pop
}

windowrule {
  name = windowrule-9
  persistent_size = on
  pin = on
  no_follow_mouse = on
  no_initial_focus = on
  match:tag = decor
}


windowrule {
  name = windowrule-10
  float = on
  border_size = 0
  match:tag = util
}


windowrule {
  name = windowrule-11
  opaque = on
  no_dim = on
  match:tag = important
}


# -- LAYER
layerrule {
  name = layerrule-1
  blur = on
  ignore_alpha = 0
  match:namespace = notifications
}

layerrule {
  name = layerrule-2
  blur = on
  blur_popups = on
  ignore_alpha = 0
  match:namespace = quickshell
}


# -- Caelestia Layer rules
layerrule {
  name = layerrule-3
  animation = fade
  match:namespace = hyprpicker  # Colour picker out animation
}

layerrule {
  name = layerrule-4
  animation = fade
  match:namespace = logout_dialog  # wlogout
}

layerrule {
  name = layerrule-5
  animation = fade
  match:namespace = selection  # slurp
}

layerrule {
  name = layerrule-6
  animation = fade
  match:namespace = wayfreeze
}

# Fuzzel
layerrule {
  name = layerrule-7
  animation = popin 80%
  blur = on
  match:namespace = launcher
}

# Shell
layerrule {
  name = layerrule-8
  no_anim = on
  match:namespace = caelestia-(border-exclusion|area-picker)
}

layerrule {
  name = layerrule-9
  animation = fade
  match:namespace = caelestia-(drawers|background)
}


layerrule {
  name = layerrule-10
  blur = on
  ignore_alpha = 0.57
  match:namespace = caelestia-drawers
}


# Special workspaces
windowrule {
  name = windowrule-12
  workspace = special:sysmon
  match:class = btop
}

windowrule {
  name = windowrule-13
  workspace = special:music
  match:class = feishin|Spotify|Supersonic
}

windowrule {
  name = windowrule-14
  workspace = special:music
  match:initial_title = Spotify( Free)?  # Spotify wayland
}

windowrule {
  name = windowrule-15
  workspace = special:communication
  match:class = discord|equibop|vesktop|whatsapp
}

windowrule {
  name = windowrule-16
  workspace = special:todo
  match:class = Todoist
}


# Dialogs
windowrule {
  name = windowrule-17
  float = on
  match:title = (Select|Open)( a)? (File|Folder)(s)?
}

windowrule {
  name = windowrule-18
  float = on
  match:title = (Вибрати|Відкрити) ([Фф]айл|[Тт]теку)(и)?
}


windowrule {
  name = windowrule-19
  float = on
  match:title = File (Operation|Upload)( Progress)?
}


windowrule {
  name = windowrule-20
  float = on
  match:title = ^.*(Properties|Властивості).*$
}


windowrule {
  name = windowrule-21
  float = on
  match:title = ^(Export.* as|Зберегти).*
}


windowrule {
  name = windowrule-22
  float = on
  match:title = GIMP Crash Debug
}


windowrule {
  name = windowrule-23
  float = on
  match:title = ^(Library|Бібліотека).*$
}

windowrule {
  name = windowrule-24
  float = on
  match:title = ^(Information|Інформація).*$
}


# Picture in picture (resize and move done via script)
windowrule {
  name = windowrule-25
  move = ((monitor_w*1)-window_w-(monitor_w*0.02)) ((monitor_h*1)-window_h-(monitor_h*0.03))
  match:title = Зображення(-| )в(-| )[Зз]ображенні  # Initial move so window doesn't shoot across the screen from the center
}

windowrule {
  name = windowrule-26
  keep_aspect_ratio = on
  float = on
  pin = on
  match:title = Зображення(-| )в(-| )[Зз]ображенні
}


# GAMES
# -- native
windowrule {
  name = windowrule-27
  content = game
  match:class = ^(factorio)$
}


# -- proton/gamescope
windowrule {
  name = windowrule-28
  content = game
  match:class = ^(steam_app_.*)$
}

windowrule {
  name = windowrule-29
  content = game
  match:class = ^(gamescope)$
}

windowrule {
  name = windowrule-30
  content = game
  match:class = ^(Warframe*)$
}


# -- rules
# windowrule = immediate, content:game
windowrule {
  name = windowrule-31
  rounding = 0
  no_anim = on
  border_size = 0
  no_shadow = on
  force_rgbx = on
  focus_on_activate = on
  match:content = game
}



# UTILS
# -- term
windowrule {
  name = windowrule-32
  size = 597>600 60>63
  monitor = DP-1
  move = ((monitor_w*1)-window_w-60) (1320)
  decorate = on
  match:class = ^(showmethekey.*)$
}


# -- image
windowrule {
  name = windowrule-33
  opaque = on
  match:class = ^(imv.*)$
}


# -- video

# -- browser
windowrule {
  name = windowrule-34
  focus_on_activate = on
  match:class = ^(zen-.*)$
}


# BINDS
$mainMod = SUPER
# default programs
$terminal = kitty
$fileManager = thunar
$menu = caelestia:launcher

exec = hyprctl dispatch submap global
submap = global

# bind = CTRL, C, exec, wl-copy
# bind = CTRL, V, exec, wl-paste
bind = $mainMod, R, global, $menu
bindin = Super, catchall, global, caelestia:launcherInterrupt
bindin = Super, mouse:272, global, caelestia:launcherInterrupt
bindin = Super, mouse:273, global, caelestia:launcherInterrupt
bindin = Super, mouse:274, global, caelestia:launcherInterrupt
bindin = Super, mouse:275, global, caelestia:launcherInterrupt
bindin = Super, mouse:276, global, caelestia:launcherInterrupt
bindin = Super, mouse:277, global, caelestia:launcherInterrupt
bindin = Super, mouse_up, global, caelestia:launcherInterrupt
bindin = Super, mouse_down, global, caelestia:launcherInterrupt
bind = $mainMod, T, exec, $terminal
bind = $mainMod, C, killactive,
# bind = $mainMod SHIFT, C, hy3:killactive,
# bind = $mainMod, M, exit,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, togglesplit, # dwindle
bind = $mainMod, I, pin, active
bind = $mainMod, U, exec, hyprctl setprop active opaque toggle
# bind = , Print, exec, grim -g "$(slurp)" - | wl-copy
# bind = ALT, Print, exec, grimblast --freeze --notify edit area
# bind = $mainMod, Print, exec, grimblast --freeze --notify copysave area $(date + '%s_grim.png')
bind = , Print, exec, caelestia screenshot --freeze --region
binde = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_SINK@ 3%+
binde = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_SINK@ 3%-
