# monitors
# monitor = DP-1, 2560x1440@165, 0x0, 1, bitdepth, 10, cm, auto

# source = ./dms/outputs.conf
$monitor0 = DP-1
$monitor1 = DP-2

monitorv2 {
  output = $monitor0
  mode = 2560x1440@165
  position = 0x0
  scale = 1
  supports_wide_color = 1
  supports_hdr = 1

  bitdepth = 10
  # cm = auto
  vrr = 2

  sdrbrightness = 1.2
  sdrsaturation = 0.99
  sdr_min_luminance = 0.027
  sdr_max_luminance = 1000
  max_avg_luminance = 300
}

monitor = $monitor1, 1920x1200@60, 2561x0, 1, transform, 1

# -- laptop
# monitor = eDP-1, 1920x1080@60, 0x0, 1

# execute at launch
exec-once = $HOME/.config/hypr/scripts/autostart

# plugins
# exec-once = hyprpm reload -n
# plugin = /usr/lib/libhy3.so
# -- source
# source = ~/.config/hypr/modules/plugins.conf

# env vars
# env = DRI_PRIME,1
env = TERMINAL,/usr/bin/kitty
env = EDITOR,/usr/bin/nvim

# - Aquamarine
env = AQ_DRM_DEVICES,/dev/dri/card1

# - cursor
env = HYPRCURSOR_THEME,Moga-Neon-Green
env = HYPRCURSOR_SIZE,24

env = XCURSOR_THEME,Moga-Neon-Green
env = XCURSOR_SIZE,24

# - platform vars
env = GTK_THEME,Sweet:dark
env = GDK_BACKEND,wayland,x11,*
env = QS_ICON_THEME,candy-icons

env = SDL_VIDEODRIVER,wayland,x11
env = CLUTTER_BACKEND,wayland

env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_SCALE_FACTOR,1
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_QPA_PLATFORMTHEME,qt6ct
# env = QT_QUICK_BACKEND,vulkan
# env = QSG_RHI_BACKEND,vulkan

env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = XDG_DATA_HOME,/home/xnzf
env = XDG_CONFIG_HOME,/home/xnzf/.config
env = XDG_CACHE_HOME,/home/xnzf/.cache

env = ELECTRON_OZONE_PLATFORM_HINT,auto

# - AMD
env = AMD_VULKAN_ICD,radv
env = WLR_DRM_DEVICES,/dev/dri/by-path/pci-0000:03:00.0-card
env = __GLX_VENDOR_LIBRARY_NAME,mesa
env = MESA_LOADER_DRIVER_OVERRIDE,radeonsi
env = MESA_VK_DEVICE_SELECT,1002:7550
env = MESA_GPU_SELECTION,1002:7550
env = RADV_PERFTEST,transfer_queue

# - VULKAN
env = VK_ICD_FILENAMES,/usr/share/vulkan/icd.d/radeon_icd.i686.json:/usr/share/vulkan/icd.d/radeon_icd.x86_64.json
env = WLR_DRM_NO_ATOMIC,0
env = FOSSILIZE_REPLAY_THREAD_COUNT,4
