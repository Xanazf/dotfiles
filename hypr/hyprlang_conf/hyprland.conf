# env = VKD3D_FRAME_RATE,144
# env = VKD3D_HDR,1
# env = VKD3D_CONFIG, dxr # force_static_cbv # nvidia only

# - wine/proton
env = PROTON_WAYLAND_MONITOR,$monitor0

# - nvidia
