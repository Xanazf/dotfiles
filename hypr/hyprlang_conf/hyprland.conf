# WORKSPACES
# -- main
workspace = 1, name:initial, monitor:DP-1, border:0, rounding:0, decorate:0, persistent:true
workspace = 2, name:web, monitor:DP-1, default:true, persistent:true
workspace = special:scratchpad, monitor:DP-1, on-created-empty:kitty

# -- secondary
workspace = special:communication, name:social, monitor:DP-2, on-created-empty:vesktop
workspace = 3, name:notes, monitor:DP-2, on-created-empty:nvim, default:true, persistent:true
