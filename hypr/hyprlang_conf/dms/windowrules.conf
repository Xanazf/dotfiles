# HyprDank
windowrule = tile on, match:class ^(org\.wezfurlong\.wezterm)$

windowrule = rounding 12, match:class ^(org\.gnome\.)

windowrule = tile on, match:class ^(gnome-control-center)$
windowrule = tile on, match:class ^(pavucontrol)$
windowrule = tile on, match:class ^(nm-connection-editor)$

windowrule = float on, match:class ^(gnome-calculator)$
windowrule = float on, match:class ^(galculator)$
windowrule = float on, match:class ^(blueman-manager)$
windowrule = float on, match:class ^(org\.gnome\.Nautilus)$
windowrule = float on, match:class ^(xdg-desktop-portal)$

windowrule = no_initial_focus on, match:class ^(steam)$, match:title ^(notificationtoasts)
windowrule = pin on, match:class ^(steam)$, match:title ^(notificationtoasts)

windowrule = float on, match:class ^(firefox)$, match:title ^(Picture-in-Picture)$
windowrule = float on, match:class ^(zoom)$

layerrule = no_anim on, match:namespace ^(quickshell)$
layerrule = no_anim on, match:namespace ^dms:.*
# layerrule = blur on, match:namespace ^dms:.*

# GLOB
# -- rule setting
windowrule {
  name = windowrule-8
  size = (monitor_w*0.35) (monitor_h*0.35)
  float = on
  center = 1
  match:tag = pop
}

windowrule {
  name = windowrule-9
  persistent_size = on
  pin = on
  no_follow_mouse = on
  no_initial_focus = on
  match:tag = decor
}

windowrule {
  name = windowrule-10
  float = on
  border_size = 0
  match:tag = util
}

windowrule {
  name = windowrule-11
  opaque = on
  no_dim = on
  match:tag = important
}

# -- variable/tag setting
windowrule {
  name = windowrule-1
  tag = +decor, util
  match:class = ^(.*showmethekey)$
}

windowrule {
  name = windowrule-4
  tag = +pop
  match:class = ^([tT]hunar|.*pavucontrol)$
}

windowrule {
  name = windowrule-5
  tag = +important
  match:class = ^(firefox*?)$
}

windowrule {
  name = windowrule-6
  tag = +important
  match:class = ^(zen-.*)$
}

windowrule {
  name = windowrule-7
  tag = +important
  match:class = ^(kitty)$
}

# -- LAYER
layerrule {
  name = layerrule-1
  blur = on
  ignore_alpha = 0
  match:namespace = notifications
}

layerrule {
  name = layerrule-2
  blur = on
  blur_popups = on
  ignore_alpha = 0
  match:namespace = quickshell
}

# -- Caelestia Layer rules
layerrule {
  name = layerrule-3
  animation = fade
  match:namespace = hyprpicker  # Colour picker out animation
}

layerrule {
  name = layerrule-4
  animation = fade
  match:namespace = logout_dialog  # wlogout
}

layerrule {
  name = layerrule-5
  animation = fade
  match:namespace = selection  # slurp
}

layerrule {
  name = layerrule-6
  animation = fade
  match:namespace = wayfreeze
}

# Fuzzel
layerrule {
  name = layerrule-7
  animation = popin 80%
  blur = on
  match:namespace = launcher
}

# Shell
layerrule {
  name = layerrule-8
  no_anim = on
  match:namespace = caelestia-(border-exclusion|area-picker)
}

layerrule {
  name = layerrule-9
  animation = fade
  match:namespace = caelestia-(drawers|background)
}

layerrule {
  name = layerrule-10
  blur = on
  ignore_alpha = 0.57
  match:namespace = caelestia-drawers
}

# Special workspaces
windowrule {
  name = windowrule-12
  workspace = special:sysmon
  match:class = btop
}

windowrule {
  name = windowrule-13
  workspace = special:music
  match:class = feishin|Spotify|Supersonic
}

windowrule {
  name = windowrule-14
  workspace = special:music
  match:initial_title = Spotify( Free)?  # Spotify wayland
}

windowrule {
  name = windowrule-15
  workspace = special:communication
  match:class = discord|equibop|vesktop|whatsapp
}

windowrule {
  name = windowrule-16
  workspace = special:todo
  match:class = Todoist
}


# Dialogs
windowrule {
  name = windowrule-17
  float = on
  match:title = (Select|Open)( a)? (File|Folder)(s)?
}

windowrule {
  name = windowrule-18
  float = on
  match:title = (Вибрати|Відкрити) ([Фф]айл|[Тт]теку)(и)?
}

windowrule {
  name = windowrule-19
  float = on
  match:title = File (Operation|Upload)( Progress)?
}

windowrule {
  name = windowrule-20
  float = on
  match:title = ^.*(Properties|Властивості).*$
}

windowrule {
  name = windowrule-21
  float = on
  match:title = ^(Export.* as|Зберегти).*
}

windowrule {
  name = windowrule-22
  float = on
  match:title = GIMP Crash Debug
}

windowrule {
  name = windowrule-23
  float = on
  match:title = ^(Library|Бібліотека).*$
}

windowrule {
  name = windowrule-24
  float = on
  match:title = ^(Information|Інформація).*$
}

# Picture in picture (resize and move done via script)
windowrule {
  name = windowrule-25
  move = ((monitor_w*1)-window_w-(monitor_w*0.02)) ((monitor_h*1)-window_h-(monitor_h*0.03))
  match:title = Зображення(-| )в(-| )[Зз]ображенні  # Initial move so window doesn't shoot across the screen from the center
}

windowrule {
  name = windowrule-26
  keep_aspect_ratio = on
  float = on
  pin = on
  match:title = Зображення(-| )в(-| )[Зз]ображенні
}


# DEV
windowrule {
  name = wr-cpp
  float = on
  match:title = ^(Downloading CPP).*$
}

# GAMES
windowrule {
  name = windowrule-24
  # stay_focused = on
  allows_input = on
  render_unfocused = on
  tag = +modding
  match:title = ^(SSEEdit|xEdit|Synthesis|DynDOLOD|LOD Gen)$
  # match:class = ^(steam_app_0)$
}

windowrule {
  name = windowrule-24
  stay_focused = on
  allows_input = on
  render_unfocused = on
  match:class = ^(sseedit.exe)$
}

windowrule {
  name = windowrule-27
  content = game
  match:class = ^([Ff]actorio.*)$
}

windowrule {
  name = windowrule-30
  content = game
  match:class = ^(Warframe*)$
}

windowrule {
  name = steam-overlay
  stay_focused = on
  min_size = 1 1
  match:class = (steam)
  match:title = (^$)
}

windowrule {
  name = steam-general
  match:class = ^(Warframe.*|[Ff]actorio.*|steam_app_.*)$
  fullscreen = on
  monitor = 0
  content = game
  allows_input = on
  no_anim = on
  no_blur = on
  no_dim = on
  no_shadow = on
  decorate = off
  opaque = on
  immediate = on
  render_unfocused = on
  keep_aspect_ratio = on
}

windowrule {
  name = redlauncher-fix
  match:class = ^(steam_app_1091500)$
  match:title = ^(REDlauncher)$
  fullscreen = off
  float = 1
  center = 1
}

windowrule {
  name = cyberpunk-hdr
  match:class = ^(steam_app_1091500)$
  match:title = ^(Cyberpunk 2077)$
  fullscreen = on
  force_rgbx = on
}

# UTILS
# -- term
windowrule {
  name = windowrule-32
  size = 597>600 60>63
  monitor = DP-1
  move = ((monitor_w*1)-window_w-60) (1320)
  decorate = on
  match:class = ^(showmethekey.*)$
}

# -- image
windowrule {
  name = windowrule-imv
  opaque = on
  no_dim = on
  match:title = ^(imv).*$
}

windowrule {
  name = windowrule-mpv
  opaque = on
  no_dim = on
  match:title = ^.*(mpv)$
}

# -- video

# -- browser
windowrule {
  name = windowrule-34
  focus_on_activate = on
  match:class = ^(zen-.*)$
}
